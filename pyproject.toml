[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "suction-thrust-lab"
version = "0.1.0"
description = "Fan suction, cold-gas thrust, and vehicle dynamics experiments with MuJoCo"
readme = "README.md"
keywords = ["mujoco", "physics", "suction", "thrusters", "vehicle-dynamics"]
requires-python = ">=3.10"
dependencies = ["mujoco>=3.3,<4", "numpy>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
suction-thrust-lab = "suction_thrust_lab.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["suction_thrust_lab*"]

[tool.setuptools.package-data]
suction_thrust_lab = ["default.json", "halfpipe.json", "full_size.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
